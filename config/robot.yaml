# =============================================================================
# robot.yaml — 하드웨어 / 네트워크 설정
# =============================================================================
# 기기 구성 (CLAUDE.md "하드웨어 구성" 참고):
#
#   🍓 파이 : 로봇(양팔 + 바퀴 3개 + 카메라)이 USB 로 붙음. scripts/host.sh 만 실행
#   💻 PC   : 녹화(record.sh), 추론 서버, 추론 노드(arm_node.py), 에이전트
#
#   (예전 Pi-A / Pi-B 두 대 구성의 흔적이 navigation 블록에 남아 있습니다.)
#
# API 키는 여기 쓰지 말 것. 환경변수로만 넘깁니다.

# --- 🍓 파이 : 로봇 호스트 (scripts/host.sh 가 읽음) --------------------------
# 녹화와 추론이 둘 다 이 호스트를 통하므로 **캘리브레이션이 한 벌**입니다.
# 아직 파이에서 확인 안 한 값이라 비워 뒀습니다. 파이에서 확인해서 채우세요.
#   포트:  ls -l /dev/serial/by-id/   또는 lerobot-find-port
#   id  :  ~/.cache/huggingface/lerobot/calibration/robots/bi_so_base_follower/
#          에 있는 <id>_left.json / <id>_right.json 의 <id>
# 환경변수 FOLLOWER_LEFT_PORT / FOLLOWER_RIGHT_PORT / FOLLOWER_ID 가 있으면 그게 우선.
host:
  left_port:  null              # 왼팔 follower
  right_port: null              # 오른팔 follower (바퀴 ID 7/8/9 도 이 버스)
  id:         null              # 캘리브레이션 파일 이름

# --- 💻 PC : 추론 노드 (src/arm_node.py) -------------------------------------
# 녹화(record.sh)와 같은 bi_so_base_client 로 파이 호스트에 붙습니다.
arms:
  remote_ip: "xlerobot2.local"  # 파이 (record.sh 의 PI_HOST 와 같아야 함)
  id: "bi_so101"                # record.sh 의 ROBOT_ID 와 같게

  # 에이전트(main.py)와 arm_node.py 가 같은 PC 에서 돕니다.
  control_address: "tcp://127.0.0.1:5580"
  bind_address: "tcp://127.0.0.1:5580"

  # --- 카메라 구성 ---------------------------------------------------------
  # 카메라 목록은 config/cameras.<이름>.yaml 에 있습니다.
  # 녹화(scripts/record.sh)와 추론(src/arm_node.py)이 **같은 파일**을 읽으므로
  # 카메라 이름이 어긋날 수 없습니다. 전에는 두 곳에 손으로 적어뒀습니다.
  #
  #   3cam  탑캠 + 손목캠 x2            (현재 운용 구성)
  #   4cam  탑캠 + 베이스캠 + 손목캠 x2  (비교 실험용)
  #
  # 목록 확인:  python src/camera_config.py
  # 장치 확인:  python src/camera_config.py 3cam --check
  #
  # ⚠️ 여기를 바꾸면 **학습된 정책과 카메라 구성이 달라집니다.**
  #    정책은 학습 때 본 이미지 키만 받습니다. 4cam 으로 모은 데이터로
  #    학습한 뒤에만 4cam 으로 바꾸세요. 안 맞으면 팔이 아예 안 움직입니다.
  camera_set: "3cam"

  # 주행 중 팔 자세(파킹 포즈).
  # 이동 중 팔이 벌어져 있으면 문틀·가구에 부딪힙니다. 이동 전에 항상 이 자세로 접습니다.
  # 값은 lerobot-find-joint-limits 로 실제 로봇에서 확인해 채우세요.
  travel_pose:
    left_shoulder_pan.pos:   0.0
    left_shoulder_lift.pos: -95.0
    left_elbow_flex.pos:     95.0
    left_wrist_flex.pos:     0.0
    left_wrist_roll.pos:     0.0
    left_gripper.pos:        0.0
    right_shoulder_pan.pos:  0.0
    right_shoulder_lift.pos: -95.0
    right_elbow_flex.pos:    95.0
    right_wrist_flex.pos:    0.0
    right_wrist_roll.pos:    0.0
    right_gripper.pos:       0.0
  park_seconds: 2.5           # 파킹 포즈까지 몇 초에 걸쳐 부드럽게 이동할지

  # 물건을 실제로 잡았는지 판정하는 기준.
  # 그리퍼가 "끝까지 닫혔다" = 사이에 아무것도 없다 = 못 잡은 것.
  # joint  : 물건을 잡는 팔의 그리퍼 관절 이름
  # min    : 이 값보다 작으면 완전히 닫힘 -> 못 잡음
  # max    : 이 값보다 크면 거의 안 닫힘 -> 못 잡음(놓쳤거나 헛집음)
  # ※ 실제 값은 주사위를 쥔 채로 아래를 돌려서 확인하고 채우세요.
  #     python src/arm_node.py  를 띄운 뒤 다른 터미널에서
  #     python -c "import zmq,json;s=zmq.Context().socket(zmq.REQ);\
  #       s.connect('tcp://127.0.0.1:5580');s.send_string(json.dumps({'cmd':'grippers'}));\
  #       print(s.recv_string())"
  grasp_check:
    joint: "right_gripper.pos"
    min: 3.0
    max: 55.0

# --- 💻 PC : SmolVLA 추론 서버 ----------------------------------------------
# lerobot 의 async inference 를 씁니다.
#   PC 에서:  lerobot-policy-server --host=127.0.0.1 --port=8080
#   PC 에서:  python src/arm_node.py     (같은 PC 라서 gRPC 는 무선을 안 탑니다)
policy:
  server_address: "127.0.0.1:8080"       # 같은 PC
  type: "smolvla"
  path: "outputs/train/smolvla_home/checkpoints/last/pretrained_model"
  device: "cuda"                # 서버(PC) 쪽 장치
  fps: 30                       # 데모 수집 fps 와 동일해야 함
  actions_per_chunk: 50         # 한 번에 받아오는 행동 개수
  # 큐가 이 비율 이하로 줄면 새 관측을 정책 서버로 보냅니다. 0.5 면 약 25스텝(≈0.8초)에 한 번.
  chunk_size_threshold: 0.5

# --- 🛞 Pi-B : 자율주행(Nav2) -----------------------------------------------
# Nav2 스택과 액션 클라이언트가 전부 Pi-B 안에서 돕니다 (src/nav_node.py).
# PC 는 ZMQ 로 목표만 던지므로 **PC 에 ROS2 를 설치할 필요가 없습니다.**
navigation:
  # 에이전트(PC)가 Pi-B 에 명령을 보낼 주소
  control_address: "tcp://192.168.0.102:5581"   # ← Pi-B(르키위) 의 IP
  bind_address: "tcp://0.0.0.0:5581"            # Pi-B 에서 listen 할 주소

  action_name: "navigate_to_pose"
  timeout_s: 60.0
  # 도착 후 팔을 쓰기 전 대기. 트롤리 관성이 가라앉을 때까지.
  settle_s: 1.5

# --- 💻 PC : 에이전트(명령 해석) ----------------------------------------------
agent:
  provider: "gemini"
  model: "gemini-flash-lite-latest"
  # API 키는 환경변수 GEMINI_API_KEY 로만.
