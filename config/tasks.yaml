# =============================================================================
# tasks.yaml — 태스크·위치 정의의 단일 진실 소스(single source of truth)
# =============================================================================
# 여기만 고치면 agent / record.sh 라벨 / 추론이 전부 따라옵니다.
#
# ■ 실험 태스크 (실험설계 마일스톤 PPT, 2026-10)
# ---------------------------------------------------------------------------
# 테이블에서 1m 떨어진 시작 위치(좌/중앙/우, 바닥 테이핑)에서 출발해 앞으로 주행,
# **지시한 색의 주사위를 그쪽 팔로 집어 바구니에 넣습니다.** 한 에피소드에 전부.
#
#   · 빨강·파랑 주사위를 항상 둘 다, 좌/우 영역에 하나씩 (영역 안 5지점, 매번 바뀜)
#   · 같은 장면 × 지시문 2개(red ↔ blue) = 쌍. 장면은 그대로, 지시만 바꿈
#   · 그래서 **언어를 봐야만** 정답 팔이 정해집니다 (ACT 는 언어 없는 대조군)
#   · 12조합 = 색 2 × 좌우 2 × 시작 위치 3
#
# 두 지시문은 색 단어 하나만 다릅니다. 다른 단어까지 다르면 정책이 색 말고 그
# 차이를 단서로 쓸 수 있어서, 언어 효과를 깨끗하게 분리할 수 없습니다.
#
# ⚠️ 이 문자열은 데이터셋에 그대로 들어갑니다. 녹화를 시작한 뒤에는 바꾸지 마세요.
#    scripts/record.sh 의 라벨과 글자까지 같아야 합니다 (tests_smoke.py 가 확인).
#
# 녹화 규칙·수량·평가 방법은 COLLECTING.md.

# --- 위치 정의 -----------------------------------------------------------------
# 자율주행을 안 쓰므로(robot.yaml navigation.enabled: false) pose 는 읽히지 않습니다.
# 테이블까지의 이동은 정책이 바퀴로 직접 합니다.
locations:
  - id: table
    name: 테이블              # 주사위 2개 + 바구니
    pose: {x: 0.0, y: 0.0, yaw: 0.0}

# --- 태스크 정의 ---------------------------------------------------------------
# 색마다 태스크 하나, 각각 1단계. max_seconds 90 = 평가 제한 시간.
# expect_holding 은 false: 끝났을 때 주사위는 그리퍼가 아니라 바구니에 있어야 합니다.
tasks:
  - id: red_to_basket
    name: 빨간 주사위 바구니에 넣기
    aliases: ["빨간 거 넣어줘", "빨간 주사위 바구니에", "빨강", "빨간", "red"]
    steps:
      - location: table
        prompt: "Pick up the red dice and put it in the basket"
        max_seconds: 90

  - id: blue_to_basket
    name: 파란 주사위 바구니에 넣기
    aliases: ["파란 거 넣어줘", "파란 주사위 바구니에", "파랑", "파란", "blue"]
    steps:
      - location: table
        prompt: "Pick up the blue dice and put it in the basket"
        max_seconds: 90
