# =============================================================================
# tasks.yaml — 태스크·위치 정의의 단일 진실 소스(single source of truth)
# =============================================================================
# 여기만 고치면 agent / navigation / policy 세 곳이 전부 따라옵니다.
#
# ■ 태스크는 "단계(steps)"의 나열입니다
# ---------------------------------------------------------------------------
#   [팔 접기] → 1단계 위치로 이동 → 1단계 조작
#            → [팔 접기: 그리퍼 유지] → 2단계 위치로 이동 → 2단계 조작
#
# 단계 사이의 "팔 접기"는 그리퍼를 열지 않습니다. 물건을 든 채로 이동해야 하니까요.
#
# ■ 색을 지시문으로 구분합니다
# ---------------------------------------------------------------------------
# SmolVLA 는 vision-language-action 모델이라, "어느 색"을 지정하는 통로가 지시문입니다.
# 그래서 색마다 별도의 학습 라벨입니다. 색 3개 × 단계 2개 = **학습 라벨 6종**.
#
#   pick :  Pick up the red / blue / yellow dice
#   place:  Place the dice on the red / blue / yellow spot
#
# ⚠️ 데모를 찍을 때 반드시:
#   - 매 에피소드에 **세 색을 다 놓고** 찍으세요. 빨간 것만 놓고 "빨간 거 집어"를 찍으면
#     정책이 지시문을 무시하고 "거기 있는 거 아무거나 집기"를 배웁니다.
#   - 색과 **위치를 섞으세요.** 빨강이 항상 왼쪽이면 "빨간 거"가 아니라 "왼쪽 거"를
#     배웁니다. 에피소드마다 색의 자리를 바꿔야 색이 유일한 단서가 됩니다.
#   자세한 건 COLLECTING.md 참고.
#
# ■ expect_holding
# ---------------------------------------------------------------------------
# 단계가 끝났을 때 그리퍼에 물건이 있어야 하면 true 로 두세요.
# 그리퍼가 끝까지 닫혔으면(= 아무것도 못 잡음) 실패로 처리하고 다음 단계로 안 갑니다.
# 이게 없으면 못 집고도 2번 책상까지 가서 빈 손으로 놓는 시늉을 합니다.
# 판정 기준은 robot.yaml 의 arms.grasp_check 에서 정합니다.

# --- 위치 정의 -----------------------------------------------------------------
# pose 는 Nav2 map 프레임. x, y 는 미터, yaw 는 도(degree).
# ※ 맵을 만들기 전에는 전부 0.0 으로 두세요. 실행 시 경고가 뜹니다.
locations:
  - id: desk_1
    name: 1번 책상          # 주사위 3개가 놓여 있는 책상
    pose: {x: 0.0, y: 0.0, yaw: 0.0}

  - id: desk_2
    name: 2번 책상          # 색깔별 자리가 표시된 책상
    pose: {x: 0.0, y: 0.0, yaw: 0.0}

# --- 태스크 정의 ---------------------------------------------------------------
# 색마다 태스크 하나. 각 태스크는 [집기 → 놓기] 2단계입니다.
# 놓는 위치는 셋 다 desk_2 이고, **어느 자리에 놓는지는 지시문이 결정**합니다.
tasks:
  - id: red_transfer
    name: 빨간 주사위 옮기기
    aliases: ["빨간 거 가져와", "빨간 주사위 옮겨줘", "빨강 옮겨", "red"]
    steps:
      - location: desk_1
        prompt: "Pick up the red dice"
        max_seconds: 60
        expect_holding: true      # 끝났을 때 주사위를 쥐고 있어야 함
      - location: desk_2
        prompt: "Place the dice on the red spot"
        max_seconds: 60

  - id: blue_transfer
    name: 파란 주사위 옮기기
    aliases: ["파란 거 가져와", "파란 주사위 옮겨줘", "파랑 옮겨", "blue"]
    steps:
      - location: desk_1
        prompt: "Pick up the blue dice"
        max_seconds: 60
        expect_holding: true      # 끝났을 때 주사위를 쥐고 있어야 함
      - location: desk_2
        prompt: "Place the dice on the blue spot"
        max_seconds: 60

  - id: yellow_transfer
    name: 노란 주사위 옮기기
    aliases: ["노란 거 가져와", "노란 주사위 옮겨줘", "노랑 옮겨", "yellow"]
    steps:
      - location: desk_1
        prompt: "Pick up the yellow dice"
        max_seconds: 60
        expect_holding: true      # 끝났을 때 주사위를 쥐고 있어야 함
      - location: desk_2
        prompt: "Place the dice on the yellow spot"
        max_seconds: 60

  # ↓ 위 3개가 실제로 성공한 뒤에 나머지 태스크를 추가하세요.
  #   locations 에 bathroom / bedroom / kitchen 도 함께 넣어야 합니다.
