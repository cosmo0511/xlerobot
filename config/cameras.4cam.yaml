# =============================================================================
# cameras.4cam.yaml — 탑캠 + 베이스캠 + 손목캠 x2  (새 구성, 비교 실험용)
# =============================================================================
# 최종 관측 키:
#   observation.images.top
#   observation.images.base      ← 추가된 것
#   observation.images.left_wrist
#   observation.images.right_wrist
#
# ■ 왜 4개를 다 찍나
# ---------------------------------------------------------------------------
# "탑+베이스가 나은지, 탑+베이스+손목이 나은지"는 미리 알 수 없습니다.
# 그런데 **녹화는 되돌릴 수 없고 학습은 몇 번이든 되돌릴 수 있습니다.**
# 그래서 4개를 다 찍어두고, 학습할 때 정책 입력 키만 골라서 비교합니다:
#
#   실험 A  top + left_wrist + right_wrist     (기존 3cam 과 동일한 조건)
#   실험 B  top + base
#   실험 C  4개 전부
#
# 한 번 찍은 데이터셋으로 세 실험을 다 돌릴 수 있습니다. 재녹화 없음.
# 단, lerobot 은 데이터셋 메타에서 입력 feature 를 자동으로 뽑으므로,
# 일부만 쓰려면 학습 config 에서 입력 이미지 키를 명시적으로 제한해야 합니다.
#
# ■ ⚠️ 베이스캠 USB 는 Pi-A 에 꽂아야 합니다
# ---------------------------------------------------------------------------
# 베이스캠이 물리적으로는 르키위(Pi-B) 쪽에 달리지만, lerobot-record 와
# arm_node.py 는 **Pi-A 가 USB 로 직접 연 카메라만** 관측에 넣습니다.
# Pi-B 에 꽂으면 네트워크로 영상을 끌어와야 하고 그건 기본 지원이 없습니다.
# 케이블을 Pi-A 까지 끌어오세요.
#
# ■ ⚠️ USB 대역폭
# ---------------------------------------------------------------------------
# 640x480 30fps 4대는 MJPEG 이면 보통 버티지만 YUYV(raw) 로 열리면 못 버팁니다.
# 녹화 중 프레임이 끊기면 fps 를 15 로 낮추거나 허브를 나눠 꽂으세요.
#   (fps 를 바꾸면 policy.fps 도 같이 맞춰야 합니다 — config/robot.yaml)
#
# ■ 아래 장치 경로는 **추측값입니다.** 파이에서 고치고 시작하세요
# ---------------------------------------------------------------------------
# UVC 카메라 하나가 /dev/video* 를 보통 **2개** 만듭니다 (하나는 메타데이터 노드).
# 그래서 0/2/4/6 이 맞다는 보장이 없고, 재부팅하면 번호도 바뀝니다.
#
#   🍓 ./scripts/run_4cam.sh scan      어느 노드가 진짜 카메라인지 + 고정 경로
#   🍓 ./scripts/run_4cam.sh identify  장치마다 한 장 찍어 저장 -> 보고 이름 배정
#   🍓 ./scripts/run_4cam.sh selftest  4대가 동시에 열리는지 + 실측 fps
#   💻 ./scripts/run_4cam.sh check     파이에서 받은 그림이 맞는지 (녹화와 같은 경로)
#
# scan 이 알려주는 /dev/v4l/by-id/... 또는 /dev/v4l/by-path/... 를 쓰세요.
# /dev/videoN 은 재부팅마다 바뀝니다.
#
# 확인:  python src/camera_config.py 4cam --check   (경로가 있는지만 봅니다)

# =============================================================================
# ■ 꽂은 자리 (2026-10-10 파이에서 확인) — **이 표가 제일 중요합니다**
# =============================================================================
# by-path 는 "어느 USB 포트에 꽂았는가" 기준입니다. by-id 를 못 쓰는 이유는
# 카메라 4대 중 3대가 같은 모델·같은 시리얼(Generic_USB_Camera_200901010001)
# 이라 udev 가 by-id 링크를 하나만 만들고, 그게 재부팅 때 셋 중 누구를 가리킬지
# 보장이 없기 때문입니다.
#
#   USB 포트   그때의 노드   카메라        비고
#   1          /dev/video6   top          YHTek — 유일하게 다른 모델
#   1.4.3      /dev/video0   base
#   1.2        /dev/video4   left_wrist
#   1.3        /dev/video2   right_wrist
#
# ⚠ **케이블을 다른 포트로 옮겨 꽂으면 경로가 바뀝니다.** 96개를 다 찍을 때까지
#   같은 자리에 있어야 합니다. 꽂은 자리를 테이프로 표시해 두세요. 중간에
#   바뀌면 top 칸에 손목캠이 들어간 채로 녹화돼도 아무도 모릅니다.
#
# ⚠ /dev/videoN 번호는 재부팅하면 바뀔 수 있습니다. 위 "그때의 노드" 는 참고용일
#   뿐이고, 실제로 쓰는 건 아래 by-path 경로입니다.
#
# 다시 확인:  ./scripts/run_4cam.sh scan      (파이에서)
#            ./scripts/run_4cam.sh selftest  (4대 동시 + fps + 대역폭)

# --- 팔에 안 묶인 카메라 (접두사 없음) ----------------------------------------
top_cameras:
  # USB 포트 1 (YHTek)
  top:   {index_or_path: "/dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1:1.0-video-index0", width: 640, height: 480, fps: 30}
  # USB 포트 1.4.3
  base:  {index_or_path: "/dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.4.3:1.0-video-index0", width: 640, height: 480, fps: 30}

# --- 왼팔 (left_ 접두사) -------------------------------------------------------
left_cameras:
  # USB 포트 1.2
  wrist: {index_or_path: "/dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2:1.0-video-index0", width: 640, height: 480, fps: 30}

# --- 오른팔 (right_ 접두사) ----------------------------------------------------
right_cameras:
  # USB 포트 1.3
  wrist: {index_or_path: "/dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.3:1.0-video-index0", width: 640, height: 480, fps: 30}
